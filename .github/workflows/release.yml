name: release

# A v<version> tag publishes this build as a release that Instrumenta installs and keeps up to date
# by itself: the launcher's catalog delivers Imago as managed-web. The work is Instrumenta's shared
# workflow — build, bundle with instrumenta/product.json, audit, describe the bundle in
# instrumenta-release.json, publish. Run by hand, it builds and publishes nothing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: George-Nizor/Instrumenta/.github/workflows/web-product-release.yml@main
    with:
      product: imago
